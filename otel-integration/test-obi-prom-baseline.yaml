# Latest chart default: eBPF on, metrics Service off (prometheus_export stripped)
config:
  create: true
  data:
    discovery:
      instrument:
        - k8s_namespace: obi-prom-test
      exclude_instrument:
        - exe_path: ".*ebpf-instrument.*|.*otelcol.*"
    otel_traces_export:
      endpoint: "http://127.0.0.1:4318"
    otel_metrics_export:
      endpoint: "http://127.0.0.1:4318"
    attributes:
      kubernetes:
        enable: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
