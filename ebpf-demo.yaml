# eBPF-friendly demo: Node + Python 3 + Python 2.7 + Java + .NET + Go.
# Bitmap random walk: loader calls tier1 with X-Visited-Bitmap=0; each service sets its bit,
# picks a random unvisited service and forwards the bitmap until all bits set, then returns.
# Service bit order: tier1(0), tier2(1), tier3(2), tier4(3), tier5(4), py27-demo(5), py-demo(6), java-demo(7), dotnet-demo(8), goblog(9).
# Each service has /health (no downstream call).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-demo-go-forwarder
data:
  main.go: |
    package main
    import ("encoding/json"; "io"; "math/rand"; "net/http"; "os"; "strconv"; "strings"; "time")
    func main() {
      svc := os.Getenv("SERVICE_NAME"); if svc == "" { svc = "goblog" }
      idx, _ := strconv.Atoi(os.Getenv("SERVICE_INDEX")); if idx < 0 { idx = 9 }
      list := os.Getenv("ALL_SERVICES")
      var urls []string
      for _, s := range strings.Split(list, ",") { u := strings.TrimSpace(s); if u != "" { urls = append(urls, u) } }
      full := (1 << len(urls)) - 1
      rand.Seed(time.Now().UnixNano())
      http.HandleFunc("/health", func(w http.ResponseWriter, _ *http.Request) { w.WriteHeader(200) })
      http.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
        if r.URL.Path == "/health" { w.WriteHeader(200); return }
        path := r.URL.Path
        if b, err := json.Marshal(map[string]string{"level": "info", "msg": "request", "service": svc, "path": path}); err == nil {
            os.Stdout.Write(append(b, '\n'))
        }
        bm, _ := strconv.Atoi(r.Header.Get("X-Visited-Bitmap")); if bm < 0 { bm = 0 }
        newBm := bm | (1 << idx)
        if newBm >= full || len(urls) == 0 {
            w.WriteHeader(200); w.Write([]byte("done")); return
        }
        var unvisited []int
        for i := 0; i < len(urls); i++ { if newBm&(1<<i) == 0 { unvisited = append(unvisited, i) } }
        if len(unvisited) == 0 { w.WriteHeader(200); w.Write([]byte("done")); return }
        nextIdx := unvisited[rand.Intn(len(unvisited))]
        target := strings.TrimSuffix(urls[nextIdx], "/") + "/"
        req, _ := http.NewRequest("GET", target, nil)
        req.Header.Set("X-Visited-Bitmap", strconv.Itoa(newBm))
        if tp := r.Header.Get("Traceparent"); tp != "" { req.Header.Set("Traceparent", tp) }
        if ts := r.Header.Get("Tracestate"); ts != "" { req.Header.Set("Tracestate", ts) }
        resp, err := http.DefaultClient.Do(req)
        if err != nil { http.Error(w, err.Error(), 500); return }
        defer resp.Body.Close()
        w.WriteHeader(resp.StatusCode)
        io.Copy(w, resp.Body)
      })
      http.ListenAndServe(":8080", nil)
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-demo-python-forwarder
data:
  forwarder.py: |
    import os
    import json
    import random
    import urllib.request
    from http.server import HTTPServer, BaseHTTPRequestHandler
    service_name = os.environ.get('SERVICE_NAME', 'py-demo')
    service_index = int(os.environ.get('SERVICE_INDEX', '6'))
    all_services = [s.strip() for s in os.environ.get('ALL_SERVICES', '').split(',') if s.strip()]
    full_bitmap = (1 << len(all_services)) - 1 if all_services else 0
    def pick_unvisited(bitmap):
        return [i for i in range(len(all_services)) if not (bitmap & (1 << i))]
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.split('?')[0] == '/health':
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain')
                self.end_headers()
                self.wfile.write(b'ok')
                return
            path0 = self.path.split('?')[0]
            print(json.dumps({"level": "info", "msg": "request", "service": service_name, "path": path0}), flush=True)
            bm = int(self.headers.get('X-Visited-Bitmap') or self.headers.get('x-visited-bitmap') or '0')
            new_bm = bm | (1 << service_index)
            if new_bm >= full_bitmap or not all_services:
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain')
                self.end_headers()
                self.wfile.write(b'done')
                return
            unvisited = pick_unvisited(new_bm)
            if not unvisited:
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain')
                self.end_headers()
                self.wfile.write(b'done')
                return
            next_idx = random.choice(unvisited)
            url = all_services[next_idx].rstrip('/') + '/'
            req = urllib.request.Request(url, headers={'X-Visited-Bitmap': str(new_bm)})
            tp = self.headers.get('traceparent') or self.headers.get('Traceparent')
            if tp: req.add_header('traceparent', tp)
            ts = self.headers.get('tracestate') or self.headers.get('Tracestate')
            if ts: req.add_header('tracestate', ts)
            try:
                with urllib.request.urlopen(req, timeout=90) as r:
                    body = r.read()
                    self.send_response(r.status)
                    for k, v in r.headers.items():
                        if k.lower() not in ('transfer-encoding', 'content-length'):
                            self.send_header(k, v)
                    self.send_header('Content-Length', str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
            except Exception as e:
                self.send_response(500)
                self.end_headers()
                self.wfile.write(str(e).encode())
        def log_message(self, *args): pass
    from socketserver import ThreadingMixIn
    class ThreadedHTTPServer(ThreadingMixIn, HTTPServer): pass
    ThreadedHTTPServer(('0.0.0.0', 5000), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-demo-python27-forwarder
data:
  forwarder.py: |
    import os
    import sys
    import json
    import random
    import urllib2
    from BaseHTTPServer import HTTPServer, BaseHTTPRequestHandler
    service_name = os.environ.get('SERVICE_NAME', 'py27-demo')
    service_index = int(os.environ.get('SERVICE_INDEX', '5'))
    all_services = [s.strip() for s in os.environ.get('ALL_SERVICES', '').split(',') if s.strip()]
    full_bitmap = (1 << len(all_services)) - 1 if all_services else 0
    def log_request(path):
        # Direct write(1) sync JSON on request thread — required for OBI log_enricher (print() buffering can skip enrichment).
        os.write(1, json.dumps({"level": "info", "msg": "request", "service": service_name, "path": path}) + "\n")
    def pick_unvisited(bitmap):
        return [i for i in range(len(all_services)) if not (bitmap & (1 << i))]
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.split('?')[0] == '/health':
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain')
                self.end_headers()
                self.wfile.write('ok')
                return
            path0 = self.path.split('?')[0]
            log_request(path0)
            bm = int(self.headers.get('X-Visited-Bitmap') or self.headers.get('x-visited-bitmap') or '0')
            new_bm = bm | (1 << service_index)
            if new_bm >= full_bitmap or not all_services:
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain')
                self.end_headers()
                self.wfile.write('done')
                return
            unvisited = pick_unvisited(new_bm)
            if not unvisited:
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain')
                self.end_headers()
                self.wfile.write('done')
                return
            next_idx = random.choice(unvisited)
            url = all_services[next_idx].rstrip('/') + '/'
            req = urllib2.Request(url, headers={'X-Visited-Bitmap': str(new_bm)})
            tp = self.headers.get('traceparent') or self.headers.get('Traceparent')
            if tp: req.add_header('traceparent', tp)
            ts = self.headers.get('tracestate') or self.headers.get('Tracestate')
            if ts: req.add_header('tracestate', ts)
            try:
                r = urllib2.urlopen(req, timeout=90)
                body = r.read()
                self.send_response(r.code)
                for k, v in r.headers.items():
                    if k.lower() not in ('transfer-encoding', 'content-length'):
                        self.send_header(k, v)
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            except Exception as e:
                self.send_response(500)
                self.end_headers()
                self.wfile.write(str(e))
        def log_message(self, *args): pass
    HTTPServer(('0.0.0.0', 5000), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-demo-java-forwarder
data:
  Main.java: |
    import com.sun.net.httpserver.*;
    import java.net.*;
    import java.io.*;
    import java.net.http.*;
    import java.util.*;
    import java.util.stream.*;
    public class Main {
        public static void main(String[] args) throws Exception {
            String svc = System.getenv().getOrDefault("SERVICE_NAME", "java-demo");
            int idx = Integer.parseInt(System.getenv().getOrDefault("SERVICE_INDEX", "7"));
            String[] urls = Arrays.stream(System.getenv().getOrDefault("ALL_SERVICES", "").split(","))
                .map(String::trim).filter(s -> !s.isEmpty()).toArray(String[]::new);
            int full = urls.length == 0 ? 0 : (1 << urls.length) - 1;
            Random rnd = new Random();
            HttpServer server = HttpServer.create(new InetSocketAddress(8080), 0);
            server.createContext("/", exchange -> {
                if (!"GET".equals(exchange.getRequestMethod())) { exchange.sendResponseHeaders(405, -1); return; }
                String reqPath = exchange.getRequestURI().getPath();
                if ("/health".equals(reqPath)) {
                    exchange.sendResponseHeaders(200, 2);
                    exchange.getResponseBody().write("ok".getBytes());
                    exchange.close();
                    return;
                }
                System.out.println("{\"level\":\"info\",\"msg\":\"request\",\"service\":\"" + svc + "\",\"path\":\"" + reqPath.replace("\"", "\\\"") + "\"}");
                String tp = exchange.getRequestHeaders().getFirst("traceparent");
                int bm = 0;
                try { bm = Integer.parseInt(exchange.getRequestHeaders().getFirst("X-Visited-Bitmap")); } catch (Exception e) { }
                if (bm < 0) bm = 0;
                int newBm = bm | (1 << idx);
                if (newBm >= full || urls.length == 0) {
                    byte[] done = "done".getBytes();
                    exchange.sendResponseHeaders(200, done.length);
                    exchange.getResponseBody().write(done);
                    exchange.close();
                    return;
                }
                List<Integer> unvisited = new ArrayList<>();
                for (int i = 0; i < urls.length; i++) { if ((newBm & (1 << i)) == 0) unvisited.add(i); }
                if (unvisited.isEmpty()) {
                    byte[] done = "done".getBytes();
                    exchange.sendResponseHeaders(200, done.length);
                    exchange.getResponseBody().write(done);
                    exchange.close();
                    return;
                }
                int nextIdx = unvisited.get(rnd.nextInt(unvisited.size()));
                String target = urls[nextIdx].replaceAll("/$", "") + "/";
                try {
                    HttpClient client = HttpClient.newBuilder().connectTimeout(java.time.Duration.ofSeconds(5)).build();
                    HttpRequest.Builder rb = HttpRequest.newBuilder().uri(URI.create(target)).timeout(java.time.Duration.ofSeconds(90))
                        .header("X-Visited-Bitmap", String.valueOf(newBm)).GET();
                    if (tp != null) rb.header("traceparent", tp);
                    String ts = exchange.getRequestHeaders().getFirst("tracestate");
                    if (ts != null) rb.header("tracestate", ts);
                    HttpRequest req = rb.build();
                    HttpResponse<byte[]> r = client.send(req, HttpResponse.BodyHandlers.ofByteArray());
                    r.headers().map().forEach((k, v) -> {
                        if (!"transfer-encoding".equalsIgnoreCase(k) && !"content-length".equalsIgnoreCase(k))
                            exchange.getResponseHeaders().add(k, String.join(", ", v));
                    });
                    byte[] body = r.body();
                    exchange.sendResponseHeaders(r.statusCode(), body.length);
                    exchange.getResponseBody().write(body);
                } catch (Exception e) {
                    exchange.sendResponseHeaders(500, e.getMessage().getBytes().length);
                    exchange.getResponseBody().write(e.getMessage().getBytes());
                }
                exchange.close();
            });
            server.start();
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-demo-dotnet-forwarder
data:
  Program.cs: |
    using System;
    using System.Linq;
    using System.Net.Http;
    using Microsoft.AspNetCore.Builder;
    using Microsoft.AspNetCore.Http;
    var builder = WebApplication.CreateBuilder(args);
    var app = builder.Build();
    var svc = Environment.GetEnvironmentVariable("SERVICE_NAME") ?? "dotnet-demo";
    var idx = int.TryParse(Environment.GetEnvironmentVariable("SERVICE_INDEX"), out var i) ? i : 8;
    var urls = (Environment.GetEnvironmentVariable("ALL_SERVICES") ?? "").Split(',').Select(s => s.Trim()).Where(s => s.Length > 0).ToArray();
    var full = urls.Length == 0 ? 0 : (1 << urls.Length) - 1;
    var httpClient = new HttpClient() { Timeout = TimeSpan.FromSeconds(90) };
    var rnd = new Random();
    app.MapGet("/health", () => Results.Ok());
    app.MapGet("/{*_}", async (HttpContext ctx) => {
        if (ctx.Request.Path == "/health") { ctx.Response.StatusCode = 200; return; }
        var reqPath = ctx.Request.Path.ToString();
        Console.WriteLine("{\"level\":\"info\",\"msg\":\"request\",\"service\":\"" + svc + "\",\"path\":\"" + reqPath.Replace("\"", "\\\"") + "\"}");
        var tp = ctx.Request.Headers["traceparent"].FirstOrDefault() ?? ctx.Request.Headers["Traceparent"].FirstOrDefault();
        var bm = int.TryParse(ctx.Request.Headers["X-Visited-Bitmap"].FirstOrDefault(), out var b) ? b : 0;
        if (bm < 0) bm = 0;
        var newBm = bm | (1 << idx);
        if (newBm >= full || urls.Length == 0) {
            ctx.Response.StatusCode = 200;
            await ctx.Response.WriteAsync("done");
            return;
        }
        var unvisited = Enumerable.Range(0, urls.Length).Where(j => (newBm & (1 << j)) == 0).ToArray();
        if (unvisited.Length == 0) {
            ctx.Response.StatusCode = 200;
            await ctx.Response.WriteAsync("done");
            return;
        }
        var nextIdx = unvisited[rnd.Next(unvisited.Length)];
        var target = urls[nextIdx].TrimEnd('/') + "/";
        var request = new HttpRequestMessage(HttpMethod.Get, target);
        request.Headers.TryAddWithoutValidation("X-Visited-Bitmap", newBm.ToString());
        if (!string.IsNullOrEmpty(tp)) request.Headers.TryAddWithoutValidation("traceparent", tp.Trim());
        var ts = ctx.Request.Headers["tracestate"].FirstOrDefault() ?? ctx.Request.Headers["Tracestate"].FirstOrDefault();
        if (!string.IsNullOrEmpty(ts)) request.Headers.TryAddWithoutValidation("tracestate", ts.Trim());
        var r = await httpClient.SendAsync(request);
        ctx.Response.StatusCode = (int)r.StatusCode;
        foreach (var h in r.Headers)
            if (!string.Equals(h.Key, "Transfer-Encoding", StringComparison.OrdinalIgnoreCase) && !string.Equals(h.Key, "Content-Length", StringComparison.OrdinalIgnoreCase))
                foreach (var v in h.Value) ctx.Response.Headers.Append(h.Key, v);
        var body = await r.Content.ReadAsByteArrayAsync();
        ctx.Response.ContentLength = body.Length;
        await ctx.Response.Body.WriteAsync(body);
    });
    app.Run("http://0.0.0.0:8080");
  app.csproj: |
    <Project Sdk="Microsoft.NET.Sdk.Web">
      <PropertyGroup>
        <TargetFramework>net8.0</TargetFramework>
        <RootNamespace>dotnet_forwarder</RootNamespace>
        <ImplicitUsings>enable</ImplicitUsings>
        <Nullable>enable</Nullable>
      </PropertyGroup>
    </Project>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-demo-forwarder-script
data:
  forwarder.js: |
    const http = require('http');
    const https = require('https');
    const serviceName = process.env.SERVICE_NAME || 'forwarder';
    const serviceIndex = parseInt(process.env.SERVICE_INDEX || '0', 10);
    const allServices = (process.env.ALL_SERVICES || '').split(',').map(s => s.trim()).filter(Boolean);
    const FULL_BITMAP = (1 << allServices.length) - 1;
    const BITMAP_HEADER = 'x-visited-bitmap';
    function pickRandomUnvisited(bitmap) {
      const unvisited = [];
      for (let i = 0; i < allServices.length; i++) { if (!(bitmap & (1 << i))) unvisited.push(i); }
      return unvisited.length ? unvisited[Math.floor(Math.random() * unvisited.length)] : -1;
    }
    const server = http.createServer((req, res) => {
      const pathname = (req.url || '/').split('?')[0];
      if (pathname === '/ready' || pathname === '/short' || pathname === '/health') {
        res.writeHead(200, { 'Content-Type': 'text/plain' });
        res.end('ok');
        return;
      }
      process.stdout.write(JSON.stringify({ level: 'info', msg: 'request', service: serviceName, path: pathname }) + '\n');
      const incomingBitmap = parseInt(req.headers[BITMAP_HEADER] || '0', 10) || 0;
      const newBitmap = incomingBitmap | (1 << serviceIndex);
      if (newBitmap >= FULL_BITMAP) {
        res.writeHead(200, { 'Content-Type': 'text/plain' });
        res.end('done');
        return;
      }
      const nextIndex = pickRandomUnvisited(newBitmap);
      if (nextIndex < 0 || !allServices[nextIndex]) {
        res.writeHead(200, { 'Content-Type': 'text/plain' });
        res.end('done');
        return;
      }
      const target = allServices[nextIndex].replace(/\/$/, '') + '/';
      const opts = { rejectUnauthorized: false, timeout: 90000, headers: { [BITMAP_HEADER]: String(newBitmap) } };
      const tp = req.headers['traceparent']; if (tp) opts.headers['traceparent'] = tp;
      const ts = req.headers['tracestate']; if (ts) opts.headers['tracestate'] = ts;
      const client = target.startsWith('https') ? https : http;
      client.get(target, opts, (r) => {
        const chunks = [];
        r.on('data', (c) => chunks.push(c));
        r.on('end', () => {
          const body = Buffer.concat(chunks);
          const passHeaders = {};
          for (const [k, v] of Object.entries(r.headers)) {
            if (k.toLowerCase() !== 'transfer-encoding' && k.toLowerCase() !== 'content-length')
              passHeaders[k] = v;
          }
          passHeaders['Content-Length'] = String(body.length);
          res.writeHead(r.statusCode || 200, passHeaders);
          res.end(body);
        });
      }).on('error', (e) => {
        res.writeHead(500);
        res.end(e.message);
      });
    });
    server.listen(8080, '0.0.0.0');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebpf-demo-tier5
  labels:
    app: ebpf-demo-tier5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ebpf-demo-tier5
  template:
    metadata:
      labels:
        app: ebpf-demo-tier5
    spec:
      containers:
        - name: tier5
          image: node:20-alpine
          command: ["node", "/app/forwarder.js"]
          env:
            - name: SERVICE_NAME
              value: "tier5"
            - name: SERVICE_INDEX
              value: "4"
            - name: ALL_SERVICES
              value: "http://ebpf-demo-tier1:8080,http://ebpf-demo-tier2:8080,http://ebpf-demo-tier3:8080,http://ebpf-demo-tier4:8080,http://ebpf-demo-tier5:8080,http://py27-demo:5000,http://py-demo:5000,http://java-demo:8080,http://dotnet-demo:8080,http://goblog:8080"
          volumeMounts:
            - name: script
              mountPath: /app
          ports:
            - containerPort: 8080
              name: http
      volumes:
        - name: script
          configMap:
            name: ebpf-demo-forwarder-script
