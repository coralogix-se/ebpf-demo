# Load generator: plain Node so OBI instruments it and injects traceparent; no explicit trace code.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-demo-loader-script
data:
  loader.js: |
    const http = require('http');
    const tier1 = 'http://ebpf-demo-tier1:8080';
    const healthUrl = tier1 + '/health';
    const chainUrl = tier1 + '/';
    const intervalMs = 5000;
    const chainTimeoutMs = 180000;
    const warmupTimeoutMs = 90000;   // shorter than chain timeout so warmup fails fast
    const warmupRuns = 4;
    const warmupDelayMs = 2000;
    const warmupSettleMs = 8000;

    function log(msg) {
      process.stdout.write(new Date().toISOString() + ' loader: ' + msg + '\n');
    }
    function getWithTimeout(url, timeoutMs) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          req.destroy();
          reject(new Error('timeout after ' + timeoutMs + 'ms'));
        }, timeoutMs);
        const req = http.get(url, { timeout: timeoutMs, headers: { 'X-Visited-Bitmap': '0' } }, (res) => {
          let body = '';
          res.on('data', (c) => { body += c; });
          res.on('end', () => { clearTimeout(timer); resolve({ status: res.statusCode, body }); });
        });
        req.on('error', (e) => { clearTimeout(timer); reject(e); });
      });
    }
    async function waitForTier1() {
      log('probing tier1 /health until ready');
      for (let i = 0; i < 60; i++) {
        try {
          const r = await getWithTimeout(healthUrl, 5000);
          if (r.status === 200) {
            log('tier1 ready, starting warmup');
            return;
          }
        } catch (e) {
          log('tier1 health attempt ' + (i + 1) + ' failed: ' + e.message);
        }
        await new Promise((r) => setTimeout(r, 3000));
      }
      log('gave up waiting for tier1, continuing anyway');
    }
    async function warmup() {
      log('warmup: ' + warmupRuns + ' chain requests (timeout ' + (warmupTimeoutMs/1000) + 's each)');
      for (let w = 1; w <= warmupRuns; w++) {
        log('warmup ' + w + '/' + warmupRuns);
        try {
          await getWithTimeout(chainUrl, warmupTimeoutMs);
          log('warmup ' + w + '/' + warmupRuns + ' done');
        } catch (e) {
          log('warmup ' + w + '/' + warmupRuns + ' error: ' + e.message);
        }
        if (w < warmupRuns) await new Promise((r) => setTimeout(r, warmupDelayMs));
      }
      log('warmup complete, waiting ' + (warmupSettleMs/1000) + 's for JIT to settle');
      await new Promise((r) => setTimeout(r, warmupSettleMs));
      log('starting request loop');
    }
    log('process started');
    (async function loop() {
      try {
        await waitForTier1();
        await new Promise((r) => setTimeout(r, 5000));
        await warmup();
        let count = 0;
        while (true) {
          count++;
          log('starting request #' + count);
          try {
            const r = await getWithTimeout(chainUrl, chainTimeoutMs);
            log('request #' + count + ' done http_code=' + r.status);
          } catch (e) {
            log('request #' + count + ' error: ' + e.message);
          }
          log('sleeping ' + (intervalMs/1000) + 's');
          await new Promise((r) => setTimeout(r, intervalMs));
        }
      } catch (e) {
        log('loop fatal: ' + e.message);
      }
    })();
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebpf-demo-loader
  labels:
    app: ebpf-demo-loader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ebpf-demo-loader
  template:
    metadata:
      labels:
        app: ebpf-demo-loader
    spec:
      containers:
        - name: loader
          image: node:20-alpine
          command: ["sh", "-c", "cp /app/loader.js /tmp/ && node /tmp/loader.js"]
          env:
            - name: SERVICE_NAME
              value: "ebpf-demo-loader"
          volumeMounts:
            - name: script
              mountPath: /app
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
      volumes:
        - name: script
          configMap:
            name: ebpf-demo-loader-script
